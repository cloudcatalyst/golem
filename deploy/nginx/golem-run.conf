# golem.run — content-negotiated install endpoint (spec Decision 41c).
#
# Serves the right thing for `curl … | sh`, `irm … | iex`, and browsers off the
# BARE domain, by branching on User-Agent (verification-notes §70):
#   • PowerShell (irm / iwr)        -> install.ps1
#   • curl / wget / other fetchers  -> install.sh
#   • everything else (browsers)    -> the HTML landing page
#
# Deploy: put install/install.sh, install/install.ps1, deploy/nginx/landing.html,
# and the compiled binaries under $GOLEM_WEBROOT (default /var/www/golem.run),
# with binaries in $GOLEM_WEBROOT/bin/golem-<os>-<arch>[.exe]. Adjust server_name
# and the TLS cert paths, then `nginx -t && systemctl reload nginx`.

# --- put this map in the http{} context (e.g. conf.d/) -----------------------
# Order matters: test PowerShell (its UA also contains "Mozilla") BEFORE the
# default browser fall-through. Case-insensitive (~*).
map $http_user_agent $golem_install_script {
    default              "/landing.html";
    "~*powershell"       "/install.ps1";
    "~*curl"             "/install.sh";
    "~*wget"             "/install.sh";
    "~*libcurl"          "/install.sh";
    "~*\bfetch\b"        "/install.sh";
    "~*httpie"           "/install.sh";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name golem.run www.golem.run;

    # TLS — replace with your real certificate paths.
    ssl_certificate     /etc/letsencrypt/live/golem.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/golem.run/privkey.pem;

    root /var/www/golem.run;   # $GOLEM_WEBROOT

    # Bare domain: hand back the script the client's User-Agent implies.
    location = / {
        default_type text/plain;
        # internal-redirect to the resolved static file; try_files 404s cleanly.
        try_files $golem_install_script =404;
    }

    # Explicit, unambiguous paths (docs, and a fallback if UA sniffing misfires).
    location = /install.sh  { default_type text/x-shellscript; try_files /install.sh =404; }
    location = /install.ps1 { default_type text/plain;         try_files /install.ps1 =404; }

    # Standalone binaries downloaded by the install scripts (Tier 2).
    # Serve from disk, or swap this for a 302 to your GitHub Releases assets.
    location /bin/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Landing page for browsers.
    location = /landing.html { default_type text/html; }
}

# Optional: redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name golem.run www.golem.run;
    return 301 https://$host$request_uri;
}
