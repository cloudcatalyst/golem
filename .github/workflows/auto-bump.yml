name: Auto-bump minor version

# Bump the minor version on every push to main (any merge to main triggers this).
# The [skip ci] trailer in the bump commit prevents re-triggering the workflow.
# See scripts/release.mjs for the bump logic — it updates package.json,
# vscode-extension/package.json, and regenerates the compiled-in VERSION constant.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Bump minor version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version
        run: npm run release -- minor

      - name: Commit and push
        run: |
          git add -A
          git commit -m "chore(release): auto-bump minor version [skip ci]"
          git push