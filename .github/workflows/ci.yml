name: CI

on:
  push:
    branches: [main]

jobs:
  # Ubuntu-only to conserve Actions minutes on this private repo (macOS bills at
  # 10x, Windows at 2x). Cross-OS coverage now comes from local Windows dev + the
  # release workflow's Bun cross-compile — NOT a full CI matrix. To spot-check
  # macOS/Windows, temporarily add them back to `os` below, or run locally.
  test:
    name: ubuntu / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint + format
        run: npm run lint

      - name: Type check (strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Wiki lint (docs/wiki graph integrity)
        run: node dist/cli/main.js wiki check
