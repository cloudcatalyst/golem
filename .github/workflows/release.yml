name: Release

# Cuts a release when a vX.Y.Z tag is pushed (spec Decision 41d):
#   1. verify        — the same gate as CI, plus a tag↔package.json version check
#   2. binaries      — cross-compile all standalone targets with Bun (one host)
#   3. release       — create/update the GitHub Release and attach the binaries
#   4. npm-publish   — OPTIONAL, skipped unless the NPM_TOKEN secret is set
#   5. vscode-publish— OPTIONAL, skipped unless the VSCE_PAT secret is set
#
# The install scripts fetch GOLEM_INSTALL_BASE/bin/golem-<os>-<arch>; point the
# nginx /bin/ location at this Release's assets (see deploy/nginx/golem-run.conf).
#
# Manual re-run: Actions → Release → "Run workflow" with an existing tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build the release for"
        required: true

permissions:
  contents: write # create Releases and upload assets

jobs:
  verify:
    name: Verify + resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG — run 'npm run release' before tagging"
            exit 1
          fi

      - name: Lint + format
        run: npm run lint

      - name: Type check (strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Wiki lint
        run: node dist/cli/main.js wiki check

  binaries:
    name: Standalone binaries (Bun)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: npm ci

      - name: Cross-compile all targets
        run: npm run build:binary

      - name: Checksums
        working-directory: dist-bin
        run: sha256sum golem-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: golem-binaries
          path: dist-bin/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golem-binaries
          path: dist-bin

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" dist-bin/* --clobber
          else
            echo "Creating Release $TAG."
            gh release create "$TAG" dist-bin/* --title "$TAG" --generate-notes
          fi

  npm-publish:
    name: Publish to npm (optional)
    needs: verify
    runs-on: ubuntu-latest
    # Job-level env so the step `if` below can read it (a step can't reliably
    # read its own env, and secrets aren't visible in `if`). Empty when the
    # secret is unset → the publish step is skipped.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (skipped without NPM_TOKEN)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public

  vscode-publish:
    name: Publish VS Code extension (optional)
    needs: verify
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish (skipped without VSCE_PAT)
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
